<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101c42"><meta name="description" content="DannyBoy 经典俄罗斯方块与全班排行榜"><meta property="og:title" content="DannyBoy 俄罗斯方块"><meta property="og:description" content="挑战全班排行榜"><meta property="og:image" content="./og.png"><title>DannyBoy 俄罗斯方块</title><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"></head>
<body><main class="app-shell">
  <header class="topbar"><div class="brand"><span>DANNYBOY</span><strong>俄罗斯方块</strong></div><div class="top-actions"><button id="rankBtn" class="icon-btn" aria-label="排行榜">🏆</button><button id="soundBtn" class="icon-btn" aria-label="声音">🔊</button><button id="pauseBtn" class="icon-btn" aria-label="暂停">Ⅱ</button></div></header>
  <section class="game-layout">
    <aside class="stats left-stats"><div class="stat"><small>SCORE</small><b id="score">000000</b></div><div class="stat"><small>BEST</small><b id="best">000000</b></div><div class="stat"><small>LINES</small><b id="lines">000</b></div><div class="stat"><small>LEVEL</small><b id="level">01</b></div></aside>
    <div class="board-wrap"><canvas id="gameCanvas" width="300" height="600" aria-label="俄罗斯方块游戏区域"></canvas><div id="flash" class="line-flash"></div><div id="centerMessage" class="center-message hidden"></div></div>
    <aside class="side-panel"><div class="preview-box"><small>NEXT</small><canvas id="nextCanvas" width="120" height="100"></canvas></div><div class="preview-box"><small>HOLD</small><canvas id="holdCanvas" width="120" height="100"></canvas></div><div class="player-card"><small>PLAYER</small><strong id="playerName">---</strong></div><div class="keys"><span>← → 移动</span><span>↑ 旋转</span><span>↓ 加速</span><span>空格 落下</span><span>C 暂存</span></div></aside>
  </section>
  <section class="mobile-controls" aria-label="手机游戏控制"><button data-action="left" aria-label="向左">◀</button><button data-action="rotate" aria-label="旋转">↻</button><button data-action="right" aria-label="向右">▶</button><button data-action="down" aria-label="加速下降">▼</button><button data-action="drop" class="drop" aria-label="快速落下">落下</button><button data-action="hold" aria-label="暂存方块">暂存</button></section>
  <div id="nameModal" class="modal open"><div class="pixel-panel name-panel"><p class="eyebrow">WELCOME PLAYER</p><h1>DANNYBOY<br><span>俄罗斯方块</span></h1><p>第一次来？输入你的名字，成绩就会出现在全班排行榜。</p><label for="nameInput">玩家姓名</label><input id="nameInput" maxlength="16" autocomplete="nickname" placeholder="例如：小明"><button id="startBtn" class="primary-btn">开始游戏</button><small>无需注册 · 只记录昵称和游戏成绩</small></div></div>
  <div id="gameOverModal" class="modal"><div class="pixel-panel result-panel"><p class="eyebrow">GAME OVER</p><h2>挑战结束</h2><div class="result-score"><small>SCORE</small><strong id="finalScore">0</strong></div><p id="resultStatus">正在提交成绩…</p><div class="modal-actions"><button id="againBtn" class="primary-btn">再来一局</button><button id="resultRankBtn" class="secondary-btn">查看排行榜</button></div></div></div>
  <div id="pauseModal" class="modal"><div class="pixel-panel compact"><p class="eyebrow">PAUSED</p><h2>游戏暂停</h2><button id="resumeBtn" class="primary-btn">继续</button><button id="restartBtn" class="secondary-btn">重新开始</button></div></div>
  <div id="rankModal" class="modal"><div class="pixel-panel rank-panel"><button id="closeRankBtn" class="close-btn" aria-label="关闭">×</button><p class="eyebrow">HALL OF FAME</p><h2>全班排行榜</h2><div class="rank-head"><span>名次 / 玩家</span><span>分数</span></div><ol id="rankList" class="rank-list"><li class="loading">正在读取排行榜…</li></ol><button id="rankPlayBtn" class="primary-btn">开始挑战</button></div></div>
  <script src="./config.js"></script><script src="./game.js"></script>
</main></body></html>
